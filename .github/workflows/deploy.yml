name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Test
        run: |
          npm ci --no-audit --no-fund
          node --test scripts/collect.test.mjs
          npx tsc --noEmit

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.SSH_TARGET }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          # fetch only touches .git; the tested build.sh updates the checkout under the build lock
          ssh -i ~/.ssh/deploy_key "$SSH_TARGET" "SHA=$GITHUB_SHA bash -s" <<'REMOTE'
          set -euo pipefail
          git -C ~/blog/app fetch -q origin
          git -C ~/blog/app show "$SHA:deploy/build.sh" | sh -s "$SHA"
          REMOTE
